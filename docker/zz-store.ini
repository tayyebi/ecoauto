; DECISION (infra): the runtime configuration belongs to the image, not to
; PHP's compiled defaults.
;
; php:8.4-cli contains no php.ini at all, so every setting below was PHP's
; development default: display_errors=STDOUT, log_errors=Off,
; output_buffering=0. That is a development convenience and a production
; hazard, because a response is a byte stream: the header block is finalised
; the moment the first byte of the body is written. One notice emitted by any
; dependency therefore committed the headers early, and Symfony's
; Response::sendHeaders() then called header() on a committed response and
; raised
;
;     Cannot modify header information - headers already sent
;
; at vendor/symfony/http-foundation/Response.php:328 - replacing the real
; exception in the log with a warning about headers. Diagnosing the first fault
; then means reading past the second one.
;
; This file is copied to /usr/local/etc/php/conf.d/, so it applies to
; `php artisan` inside the container as well as to the built-in server.

; Never write diagnostics into the response body.
display_errors = Off
display_startup_errors = Off

; Still make errors visible - on stderr, which is the stream `docker compose
; logs` already reads and the same one LOG_STACK=single,stderr writes to.
; `error_log` is deliberately left unset: PHP then uses stderr. Pointing it at
; a file would stop working the moment STORE_DATA_PATH moved, and would fail
; silently.
log_errors = On
error_reporting = E_ALL

; No implicit buffering. Output produced before the response is a bug that
; should be visible immediately, not something a 4KB buffer hides until the
; end of the request.
output_buffering = Off

; Do not advertise the runtime in every response.
expose_php = Off

; Exception traces include function arguments by default, which is the fastest
; route for a database password to reach a log line or a rendered error page.
zend.exception_ignore_args = On
